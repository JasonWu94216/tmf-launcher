<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小台 AI 儀表盤</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AI儀表盤">
<meta name="theme-color" content="#000000">
<style>
  :root{--green:#16c784;--red:#ea3943;--muted:#8a8a8e;--card:#131316;--line:#232326;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#000;color:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;}
  body{padding:max(env(safe-area-inset-top),12px) 14px calc(64px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}
  .app-title{font-size:1.9rem;font-weight:800;letter-spacing:.03em;margin:2px 0;}
  .app-sub{color:var(--muted);font-size:.9rem;}
  .live{color:#cfcfd3;font-size:.78rem;margin-top:6px;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);
    margin-right:6px;box-shadow:0 0 8px var(--green);}
  .row{display:flex;gap:10px;margin:10px 0;}
  .btn{flex:1;background:var(--card);border:1px solid var(--line);color:#f5f5f7;
    border-radius:12px;padding:11px;font-size:.9rem;font-weight:700;}
  .btn:active{background:#1c1c22;}
  .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:8px;}
  .tab{color:var(--muted);font-weight:700;padding:9px 2px;font-size:.92rem;border-bottom:2px solid transparent;}
  .tab.on{color:#fff;border-bottom-color:#fff;}
  .panel{display:none;padding-top:12px;}
  .panel.on{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;}
  .label{color:var(--muted);font-size:.78rem;letter-spacing:.04em;}
  .price{font-size:2.9rem;font-weight:800;line-height:1.05;margin:3px 0;}
  .chg{font-size:1rem;font-weight:700;}
  .up{color:var(--green);}.down{color:var(--red);}
  .badge{display:inline-block;padding:.5rem 1.1rem;border-radius:999px;font-weight:800;font-size:1.05rem;}
  .badge.long{background:rgba(22,199,132,.15);color:var(--green);border:1px solid rgba(22,199,132,.5);}
  .badge.short{background:rgba(234,57,67,.15);color:var(--red);border:1px solid rgba(234,57,67,.5);}
  .badge.flat{background:#1c1c20;color:var(--muted);border:1px solid var(--line);}
  .conf{display:flex;gap:12px;}
  .conf .col{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .conf .t{color:var(--muted);font-size:.8rem;}
  .conf .v{font-size:1.9rem;font-weight:800;margin:2px 0;}
  .conf .th{color:var(--muted);font-size:.72rem;}
  .bar{height:7px;border-radius:6px;background:#26262b;margin-top:9px;overflow:hidden;}
  .bar>span{display:block;height:100%;border-radius:6px;}
  .metrics{display:flex;gap:10px;flex-wrap:wrap;}
  .metric{flex:1;min-width:calc(50% - 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .metric .mt{color:var(--muted);font-size:.76rem;}
  .metric .mv{font-size:1.35rem;font-weight:800;margin-top:2px;}
  .note{background:#14140f;border:1px solid #3a3a1e;color:#e6e0b8;border-radius:12px;padding:10px 13px;font-size:.8rem;margin:10px 0;}
  .sub{color:var(--muted);font-size:.9rem;margin:14px 0 4px;}
  table{width:100%;border-collapse:collapse;font-size:.78rem;}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:#000;}
  td:first-child,th:first-child{text-align:left;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px;}
  img.rep{width:100%;border-radius:12px;margin:8px 0;border:1px solid var(--line);}
  #login{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;z-index:50;}
  #login img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 40px rgba(22,199,132,.28);}
  #login input{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:12px;
    padding:14px 16px;font-size:1.1rem;width:min(260px,80vw);text-align:center;}
  #login button{background:var(--green);color:#04120c;border:0;border-radius:12px;padding:13px 34px;font-weight:800;font-size:1.05rem;}
  #login .err{color:var(--red);font-size:.85rem;min-height:1em;}
  .muted{color:var(--muted);}
</style>
</head>
<body>

<div id="login">
  <img src="apple-touch-icon.png" alt="logo">
  <div style="font-size:1.3rem;font-weight:800;">小台 AI 儀表盤</div>
  <input id="pw" type="password" inputmode="numeric" placeholder="輸入密碼" autocomplete="off">
  <button id="go">進入</button>
  <div class="err" id="err"></div>
</div>

<div id="app" style="display:none;">
  <div class="app-title">小台 AI 交易</div>
  <div class="app-sub">小型台指期貨 · AI 即時策略</div>
  <div class="live"><span class="dot"></span><span id="livetxt">載入中…</span></div>
  <div class="row">
    <button class="btn" id="refresh">🔄 立即更新</button>
    <button class="btn" id="autobtn">自動更新：開</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-p="live">即時盤中</div>
    <div class="tab" data-p="charts">圖表</div>
    <div class="tab" data-p="trades">交易紀錄</div>
    <div class="tab" data-p="res">成果</div>
  </div>
  <div class="panel on" id="p-live"></div>
  <div class="panel" id="p-charts"></div>
  <div class="panel" id="p-trades"></div>
  <div class="panel" id="p-res"></div>
</div>

<script>
const CFG = { feeds: [
  "https://raw.githack.com/JasonWu94216/tmf-data/main/data.json",      // 快：約1分鐘快取
  "https://raw.githubusercontent.com/JasonWu94216/tmf-data/main/data.json" // 穩：約5分鐘快取（備援）
], refreshMs: 30000 };
const LONG_TH = 0.751, SHORT_TH = 0.733;
const GREEN = "#16c784", RED = "#ea3943";
let PW = sessionStorage.getItem("tmf_pw") || "";
let AUTO = true, timer = null, DATA = null;

function num(x){ const n = parseFloat(String(x).replace(/,/g,"")); return isNaN(n) ? null : n; }
function fmt(n){ return (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("en-US",{maximumFractionDigits:0}); }

async function decryptData(b64, pw){
  const raw = Uint8Array.from(atob(b64.trim()), c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},
      km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function pull(pw){
  let b64=null, err=null;
  for(const u of CFG.feeds){
    try{
      const r = await fetch(u + "?t=" + Date.now(), {cache:"no-store"});
      if(r.ok){ b64 = await r.text(); break; }
      err = new Error("http"+r.status);
    }catch(e){ err = e; }
  }
  if(b64==null) throw (err || new Error("fetch"));
  try { return await decryptData(b64, pw); }
  catch(e){ return {ok:false, error:"auth"}; }
}

function parseSignals(arr){
  const status = (arr && arr[0] && arr[0][0]) || "";
  const rows = [];
  for(let i=2;i<(arr?arr.length:0);i++){
    const r=arr[i]; if(!r||!String(r[0]).trim()) continue;
    const price=num(r[1]), lc=num(r[2]), sc=num(r[3]);
    if(price==null||lc==null||sc==null) continue;
    rows.push({time:String(r[0]).trim(),price,long:lc,short:sc,
      lt:(num(r[4])==null?LONG_TH:num(r[4])), st:(num(r[5])==null?SHORT_TH:num(r[5]))});
  }
  return {status,rows};
}
function dayFromStatus(s){ const m=/【\s*([\d\/\-]+)/.exec(s||""); return m?m[1]:""; }
function refreshedFrom(s){ const m=/刷新於\s*([\d:]+)/.exec(s||""); return m?m[1]:""; }

function snapshot(status,rows){
  if(!rows.length) return {has:false,day:dayFromStatus(status),refreshed:refreshedFrom(status)};
  const last=rows[rows.length-1], first=rows[0];
  // A1 狀態列有「目前最新成交價（每分鐘更新）」，優先用它當主要顯示；沒有才退回最後一根 K 收盤
  let live=null, liveTime="";
  const mm=/目前最新價格：([\d,]+)（([^）]*)）/.exec(status||"");
  if(mm){ live=num(mm[1]); liveTime=(mm[2]||"").replace(/^[\d\-]+\s*/,""); }
  const price=(live!=null)?live:last.price;
  const dc=price-first.price, dcp=first.price?dc/first.price*100:0;
  let sig="空手觀望",side="flat";
  if(last.long>=last.lt){sig="做多訊號";side="long";}
  else if(last.short>=last.st){sig="做空訊號";side="short";}
  return {has:true,day:dayFromStatus(status),refreshed:refreshedFrom(status),
    price,live:(live!=null),liveTime,kbar:last.time,dc,dcp,long:last.long,short:last.short,lt:last.lt,st:last.st,
    maxL:Math.max(...rows.map(r=>r.long)),maxS:Math.max(...rows.map(r=>r.short)),sig,side,n:rows.length};
}

const TRADE_H=["#","進場日","進場時","出場日","出場時","方向","進場參考價","出場參考價","ATR","點數","估計損益(元)","累積損益(元)","出場原因","持有(分)"];
function parseTrades(arr){
  const data=[];
  for(let i=2;i<(arr?arr.length:0);i++){
    const r=arr[i]; if(!r||!String(r[0]).trim()) continue;
    const o={}; for(let j=0;j<TRADE_H.length;j++) o[TRADE_H[j]]=(r[j]!=null?r[j]:"");
    data.push(o);
  }
  let hold=null;
  if(data.length){ const L=data[data.length-1]; if(!String(L["出場日"]).trim())
    hold={side:L["方向"],entry:L["進場參考價"],day:L["進場日"],time:L["進場時"]}; }
  return {data,hold};
}
function parseSummary(arr){
  const o={};
  (arr||[]).forEach(r=>{ if(r&&r.length>=2&&String(r[0]).trim()&&String(r[0]).trim()!=="項目") o[String(r[0]).trim()]=String(r[1]).trim(); });
  return o;
}

function svgLines(series,yMin,yMax){
  const W=340,H=190,pL=4,pR=4,pT=12,pB=12;
  const n=Math.max(...series.map(s=>s.v.length),1);
  const xw=W-pL-pR,yh=H-pT-pB;
  const X=i=>pL+(n<=1?0:i/(n-1)*xw);
  const Y=v=>pT+(yMax===yMin?yh/2:(1-(v-yMin)/(yMax-yMin))*yh);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(const s of series){
    const pts=s.v.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
    o+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.o||1}"/>`;
  }
  return o+`</svg>`;
}

function renderLive(sig,hold){
  const el=document.getElementById("p-live");
  if(!sig.has){ el.innerHTML='<div class="card">目前沒有當日訊號資料（可能休市，或即時程式未寫入）。</div>'; return; }
  const up=sig.dc>=0, cls=up?"up":"down", ar=up?"▲":"▼";
  const lw=Math.min(sig.long/sig.lt,1)*100, sw=Math.min(sig.short/sig.st,1)*100;
  const lhit=sig.long>=sig.lt, shit=sig.short>=sig.st;
  let h=`<div class="card"><div class="label">目前小台價格 · MXF</div>
    <div class="price">${fmt(sig.price)}</div>
    <div class="chg ${cls}">${ar} ${sig.dc>=0?"+":""}${fmt(sig.dc)} 點（${sig.dcp>=0?"+":""}${sig.dcp.toFixed(2)}%）· 當日</div>
    <div class="live" style="margin-top:6px;">${sig.live?('最新成交 '+sig.liveTime):('最新 K 棒 '+sig.kbar)}　·　K棒 ${sig.kbar}　·　${sig.day}</div></div>`;
  h+=`<div class="card" style="text-align:center;"><div class="label" style="margin-bottom:8px;">目前 AI 訊號</div>
    <span class="badge ${sig.side}">${sig.sig}</span></div>`;
  h+=`<div class="conf">
    <div class="col"><div class="t">做多信心</div><div class="v" style="color:${GREEN}">${sig.long.toFixed(3)}</div>
      <div class="th">門檻 ${sig.lt.toFixed(3)}　·　當日高 ${sig.maxL.toFixed(3)}</div>
      <div class="bar"><span style="width:${lw.toFixed(0)}%;background:${GREEN};${lhit?'box-shadow:0 0 10px '+GREEN:''}"></span></div></div>
    <div class="col"><div class="t">做空信心</div><div class="v" style="color:${RED}">${sig.short.toFixed(3)}</div>
      <div class="th">門檻 ${sig.st.toFixed(3)}　·　當日高 ${sig.maxS.toFixed(3)}</div>
      <div class="bar"><span style="width:${sw.toFixed(0)}%;background:${RED};${shit?'box-shadow:0 0 10px '+RED:''}"></span></div></div></div>`;
  if(hold){ const ps=String(hold.side).indexOf("多")>=0?"long":"short";
    h+=`<div class="card"><div class="label">目前持倉</div>
      <div style="font-size:1.2rem;font-weight:800;margin-top:4px;">
      <span class="badge ${ps}" style="font-size:.9rem;">${hold.side}</span> 進場價 ${fmt(num(hold.entry))}</div>
      <div class="live">進場 ${hold.day} ${hold.time}</div></div>`;
  } else {
    h+=`<div class="card"><div class="label">目前持倉</div><div style="font-size:1.2rem;font-weight:800;margin-top:4px;">空手 · 觀望中</div></div>`;
  }
  h+=`<div class="muted" style="font-size:.78rem;margin-top:6px;">永豐模擬帳戶即時策略（非真錢）；信心值每 15 分鐘一根 K 棒更新一次。</div>`;
  el.innerHTML=h;
}

function renderCharts(rows){
  const el=document.getElementById("p-charts");
  let h="";
  if(rows.length){
    const prices=rows.map(r=>r.price), lo=Math.min(...prices), hi=Math.max(...prices), pad=Math.max((hi-lo)*.12,15);
    h+=`<div class="sub">當日價格走勢</div><div class="card" style="padding:8px 10px;">${svgLines([{v:prices,c:GREEN,w:2}],lo-pad,hi+pad)}</div>`;
    h+=`<div class="sub">模型信心 vs 進場門檻</div><div class="card" style="padding:8px 10px;">${svgLines([
      {v:rows.map(r=>r.long),c:GREEN,w:2},{v:rows.map(r=>r.short),c:RED,w:2},
      {v:rows.map(r=>r.lt),c:GREEN,w:1.3,dash:1,o:.7},{v:rows.map(r=>r.st),c:RED,w:1.3,dash:1,o:.7}],0,1)}
      <div class="live" style="text-align:center;margin-top:4px;">
      <span style="color:${GREEN}">━ 做多信心</span>　<span style="color:${RED}">━ 做空信心</span>　<span class="muted">┄ 門檻</span></div></div>`;
  } else { h+='<div class="card">目前沒有當日資料可畫圖。</div>'; }
  h+=`<div class="sub">📊 回測績效（2020–2024 全樣本外，論文主結果）</div>
    <div class="muted" style="font-size:.8rem;">扣成本後淨利 +69.5 萬、勝率 59.1%、夏普 5.40、t=9.35、五年年年賺。</div>`;
  [["15m_report_equity_vs_bh.png","策略累積報酬率 vs 買進持有"],
   ["15m_report_drawdown.png","回撤隨時間變化"],
   ["15m_report_yearly_pnl.png","逐年損益（五年皆正）"],
   ["15m_report_feat_importance.png","特徵重要性前 15"]].forEach(([f,c])=>{
    h+=`<img class="rep" src="assets/${f}" alt="${c}" loading="lazy"><div class="muted" style="font-size:.75rem;text-align:center;margin-top:-4px;">${c}</div>`;
  });
  el.innerHTML=h;
}

function renderTrades(sum,trades){
  const el=document.getElementById("p-trades");
  let h="";
  const pick=[["完整交易筆數",sum["完整交易筆數"]],["勝率",sum["勝率"]],["總損益(估計)",sum["總損益(估計)"]],
    ["獲利因子 PF",sum["獲利因子 PF"]],["最大單筆獲利",sum["最大單筆獲利"]],["最大單筆虧損",sum["最大單筆虧損"]]];
  h+=`<div class="metrics">`+pick.map(([t,v])=>`<div class="metric"><div class="mt">${t}</div><div class="mv">${v||"—"}</div></div>`).join("")+`</div>`;
  if(sum["最後更新"]) h+=`<div class="muted" style="font-size:.75rem;margin-top:6px;">統計最後更新：${sum["最後更新"]}</div>`;
  h+=`<div class="note">⚠️ 樣本仍太少（目標 30~50 筆才有參考性），單日輸贏是正常雜訊；且 7/20 孤兒單大虧尚未完整計入累積損益，此處數字僅供機制驗證，勿當策略績效引用。回測主結果見「成果」分頁。</div>`;
  h+=`<div class="sub">每一筆進出場</div>`;
  const cols=["#","進場日","進場時","出場日","出場時","方向","進場參考價","出場參考價","點數","估計損益(元)","出場原因"];
  let t=`<div class="tbl-wrap"><table><thead><tr>`+cols.map(c=>`<th>${c}</th>`).join("")+`</tr></thead><tbody>`;
  const rev=trades.slice().reverse();
  if(!rev.length) t+=`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--muted)">尚無交易紀錄</td></tr>`;
  rev.forEach(r=>{ t+=`<tr>`+cols.map(c=>`<td>${r[c]!=null?r[c]:""}</td>`).join("")+`</tr>`; });
  t+=`</tbody></table></div>`;
  el.innerHTML=h+t;
}

function renderRes(){
  const el=document.getElementById("p-res");
  el.innerHTML=`
  <div class="card"><div class="label">研究主結果（回測，已定案）</div>
    <div style="margin-top:8px;line-height:1.9;">
    36 特徵模型 · walk-forward 2020–2024 全樣本外 · 扣成本 240 元/筆<br>
    <b style="color:${GREEN}">淨利 +695,061 元</b>　｜　勝率 59.1%<br>
    夏普 5.40　｜　t=9.35（&gt;2 達標）　｜　5/5 年皆賺</div></div>
  <div class="card"><div class="label">論文方向</div>
    <div style="margin-top:6px;line-height:1.8;">用 AI 整合「技術分析（價）」與「量價資訊（量）」，預測小台短期方向；核心洞見：量價需合判、「吸收」陷阱。</div></div>
  <div class="note">完整論文草稿與給教授的進度報告保留在電腦（未公開），此處僅顯示可公開的重點結果。</div>`;
}

function renderAll(d){
  const sig=parseSignals(d["每日訊號"]||[]);
  const snap=snapshot(sig.status,sig.rows);
  const tr=parseTrades(d["交易明細"]||[]);
  const sum=parseSummary(d["統計摘要"]||[]);
  renderLive(snap,tr.hold);
  renderCharts(sig.rows);
  renderTrades(sum,tr.data);
  document.getElementById("livetxt").textContent =
    "永豐模擬帳戶 · 即時數據　·　更新於 "+(snap.refreshed||"—")+"　·　讀取 "+new Date().toLocaleTimeString("zh-TW",{hour12:false});
}

async function load(silent){
  try{
    const res=await pull(PW);
    if(!res||res.ok===false){ if(!silent){ logout("密碼錯誤或無法讀取"); } return; }
    DATA=res.data; renderAll(DATA);
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
  }catch(e){
    if(!silent) document.getElementById("err").textContent="連線失敗，請稍後再試";
  }
}
function logout(msg){
  PW=""; sessionStorage.removeItem("tmf_pw");
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("err").textContent=msg||"";
}
function startAuto(){ if(timer) clearInterval(timer); if(AUTO) timer=setInterval(()=>load(true),CFG.refreshMs); }

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); document.getElementById("p-"+t.dataset.p).classList.add("on");
}));
document.getElementById("go").addEventListener("click",()=>{
  PW=document.getElementById("pw").value.trim(); sessionStorage.setItem("tmf_pw",PW);
  document.getElementById("err").textContent="讀取中…"; load(false).then(startAuto);
});
document.getElementById("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("go").click(); });
document.getElementById("refresh").addEventListener("click",()=>load(true));
document.getElementById("autobtn").addEventListener("click",e=>{
  AUTO=!AUTO; e.target.textContent="自動更新："+(AUTO?"開":"關"); startAuto();
});

renderRes();
if(PW){ document.getElementById("err").textContent=""; load(false).then(startAuto); }
</script>
</body>
</html>
