<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 儀表盤</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 儀表盤">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;text-align:center;padding:32px;box-sizing:border-box;}
  img{width:120px;height:120px;border-radius:27px;box-shadow:0 10px 44px rgba(22,199,132,.28);}
  h1{font-size:1.5rem;margin:0;font-weight:800;letter-spacing:.02em;}
  p{color:#8a8a8e;margin:0;font-size:.95rem;line-height:1.6;}
  a.btn{margin-top:8px;background:#16c784;color:#04120c;text-decoration:none;
    font-weight:800;padding:15px 34px;border-radius:999px;font-size:1.08rem;}
</style>
</head>
<body>
<div class="wrap">
  <img src="apple-touch-icon.png" alt="小台 AI 儀表盤">
  <h1>小台 AI 儀表盤</h1>
  <p>把這個頁面「加入主畫面」<br>桌面圖示就會變成這個 K棒<br>點一下自動進入即時儀表板</p>
  <a class="btn" href="https://tmf-ai-dashboard.streamlit.app/">進入儀表板 →</a>
</div>
<script>
  (function(){
    var standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (standalone) { window.location.replace("https://tmf-ai-dashboard.streamlit.app/"); }
  })();
</script>
</body>
</html>
